# Merge gate for staging: every PR into staging (and every push to staging) must pass
# the full local test matrix before it can be merged. Required status check: "ci / verify".
name: ci

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foloprint_design_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foloprint_design_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      CI: true
      # No .env file in CI: Prisma CLI and Nest ConfigService both fall back to process env.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foloprint_design_studio_test
      # Shared by the seed (template images), the API under jest, and the Playwright-spawned
      # API server; must be one absolute path so they all see the same files.
      STORAGE_ROOT: ${{ github.workspace }}/apps/api/storage-test
      API_PORT: 3001
      WEB_PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Deterministic client generation; @prisma/client postinstall is not guaranteed to
      # find the workspace schema.
      - name: Generate Prisma client
        run: npm run prisma:generate -w @foloprint/api

      - name: Build packages
        run: npm run build:packages

      # Type gates: jest/next dev tolerate type drift; these fail the merge on any
      # type error in the API or the web app.
      - name: Build API (type gate)
        run: npm run build -w @foloprint/api

      - name: Typecheck web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Run shared tests
        run: npm run test:shared

      - name: Run renderer tests
        run: npm run test:renderer

      # Root "db:migrate" wraps "prisma migrate dev" which is interactive and refuses CI;
      # deploy applies the committed migrations non-interactively.
      - name: Prepare database
        run: |
          npm run prisma:migrate:deploy -w @foloprint/api
          npm run db:seed

      - name: Run API e2e tests
        run: npm run test:api

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Production web build for the Playwright run. Dev-mode Next compiles routes
      # on first hit and re-checks types per request; under the render-heavy suite
      # that caused a roaming one-test stall (always green isolated). The API dist
      # already exists from the type-gate build above.
      - name: Build web (production)
        run: npm run build -w @foloprint/web

      # playwright.config.ts starts the compiled API (:3001) and the production
      # web server (:3000) itself; in CI it never uses the dev servers.
      - name: Run Playwright tests
        run: npm run test:web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
